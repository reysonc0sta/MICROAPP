# Ingress opcional (requer ingress-nginx no kind).
# Sem Ingress, use o NodePort do frontend: http://localhost:30080
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microapp
  namespace: microapp
  labels:
    app.kubernetes.io/name: microapp
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
