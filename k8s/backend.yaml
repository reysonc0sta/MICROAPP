apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: microapp
  labels:
    app.kubernetes.io/name: microapp
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/name: microapp
        app.kubernetes.io/component: backend
    spec:
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done
      containers:
        - name: backend
          image: microapp-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: microapp-secrets
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: microapp-secrets
                  key: SECRET_KEY
            - name: EVOLUTION_API_URL
              valueFrom:
                configMapKeyRef:
                  name: microapp-config
                  key: EVOLUTION_API_URL
            - name: EVOLUTION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: microapp-secrets
                  key: EVOLUTION_API_KEY
            - name: EVOLUTION_INSTANCE_NAME
              valueFrom:
                configMapKeyRef:
                  name: microapp-config
                  key: EVOLUTION_INSTANCE_NAME
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: microapp-config
                  key: CORS_ORIGINS
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: microapp-config
                  key: CORS_ALLOWED_ORIGINS
            - name: CORS_ALLOW_LAN
              valueFrom:
                configMapKeyRef:
                  name: microapp-config
                  key: CORS_ALLOW_LAN
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: microapp-secrets
                  key: ADMIN_EMAIL
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: microapp-secrets
                  key: ADMIN_PASSWORD
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: microapp
  labels:
    app.kubernetes.io/name: microapp
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
